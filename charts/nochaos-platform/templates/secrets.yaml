{{- if not .Values.secrets.existingSecret }}
{{- $name := include "platform.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* A value kept from the live Secret, or a new one: upgrades never rotate secrets. */ -}}
{{- $hex := dict
  "postgres-password" (sha256sum (randAlphaNum 32) | trunc 32)
  "redis-password" (sha256sum (randAlphaNum 32) | trunc 32)
  "notify-key" (.Values.secrets.notifyKey | default (sha256sum (randAlphaNum 32)))
  "s3-access-key" (ternary (printf "GK%s" (sha256sum (randAlphaNum 32) | trunc 24)) .Values.externalS3.accessKey .Values.garage.enabled)
  "s3-secret-key" (ternary (sha256sum (randAlphaNum 32)) .Values.externalS3.secretKey .Values.garage.enabled)
  "garage-rpc-secret" (sha256sum (randAlphaNum 32))
  "garage-admin-token" (sha256sum (randAlphaNum 32) | trunc 32)
}}
{{- if and (not .Values.redis.enabled) }}
{{- $_ := set $hex "redis-password" .Values.externalRedis.password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" (dict "ctx" $ "name" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $v := $hex }}
  {{- if and (hasKey $old $k) (or $.Values.garage.enabled (not (hasPrefix "s3-" $k))) }}
  {{ $k }}: {{ index $old $k }}
  {{- else }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.smtp.password }}
  smtp-password: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.admin.password (not .Values.admin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.prefix" . }}-admin
  labels: {{- include "platform.labels" (dict "ctx" $ "name" "admin") | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.admin.password | b64enc | quote }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.prefix" . }}-database
  labels: {{- include "platform.labels" (dict "ctx" $ "name" "database") | nindent 4 }}
type: Opaque
data:
  url: {{ required "externalDatabase.url is required when postgresql.enabled=false" .Values.externalDatabase.url | b64enc | quote }}
{{- end }}
