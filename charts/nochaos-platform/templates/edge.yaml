{{- $ctx := dict "ctx" $ "name" "edge" }}
{{- $conf := include "platform.envoyConfig" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.name" $ctx }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
data:
  envoy.yaml: |
    {{- $conf | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.name" $ctx }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
  {{- with .Values.edge.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.edge.service.type }}
  selector: {{- include "platform.selector" $ctx | nindent 4 }}
  ports:
    - name: app
      port: {{ .Values.edge.service.appPort }}
      targetPort: app
      {{- with .Values.edge.service.nodePorts.app }}
      nodePort: {{ . }}
      {{- end }}
    - name: ingest
      port: {{ .Values.edge.service.ingestPort }}
      targetPort: ingest
      appProtocol: kubernetes.io/h2c
      {{- with .Values.edge.service.nodePorts.ingest }}
      nodePort: {{ . }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.name" $ctx }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.edge.replicas }}
  selector:
    matchLabels: {{- include "platform.selector" $ctx | nindent 6 }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata:
      labels: {{- include "platform.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ $conf | sha256sum | trunc 16 }}
    spec:
      {{- include "platform.pullSecrets" . | nindent 6 }}
      {{- include "platform.podSecurity" (dict "uid" 101) | nindent 6 }}
      {{- include "platform.scheduling" .Values | nindent 6 }}
      containers:
        - name: envoy
          image: {{ include "platform.image" (dict "ctx" $ "img" .Values.edge.image) }}
          args: [-c, /etc/envoy/envoy.yaml, --log-level, warn]
          ports: [{name: app, containerPort: 8080}, {name: ingest, containerPort: 4318}]
          readinessProbe: {httpGet: {path: /healthz, port: app}, periodSeconds: 5}
          lifecycle: {preStop: {sleep: {seconds: 5}}}
          resources: {{- toYaml .Values.edge.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: config, mountPath: /etc/envoy, readOnly: true}]
      volumes:
        - {name: config, configMap: {name: {{ include "platform.name" $ctx }}}}
