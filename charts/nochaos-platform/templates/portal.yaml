{{- $ctx := dict "ctx" $ "name" "portal" }}
{{ include "platform.service" (merge (dict "port" 8080) $ctx) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.name" $ctx }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels: {{- include "platform.selector" $ctx | nindent 6 }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata:
      labels: {{- include "platform.labels" $ctx | nindent 8 }}
    spec:
      {{- include "platform.pullSecrets" . | nindent 6 }}
      {{- include "platform.podSecurity" (dict "uid" 101) | nindent 6 }}
      {{- include "platform.scheduling" .Values | nindent 6 }}
      containers:
        - name: portal
          image: {{ include "platform.portalImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          lifecycle: {preStop: {sleep: {seconds: 5}}}
          resources: {{- toYaml .Values.portal.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
