{{- if and .Values.garage.enabled (include "platform.rumOn" .) }}
{{- $ctx := dict "ctx" $ "name" "garage" }}
{{- $secret := include "platform.secretName" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.name" $ctx }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    metadata_fsync = true
    data_fsync = true
    metadata_auto_snapshot_interval = "6h"
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"
    [admin]
    api_bind_addr = "[::]:3903"
  bootstrap.sh: |
{{ .Files.Get "files/garage-bootstrap.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.name" $ctx }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "platform.selector" $ctx | nindent 4 }}
  ports: [{name: s3, port: 3900, targetPort: s3}, {name: admin, port: 3903, targetPort: admin}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "platform.name" $ctx }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ include "platform.name" $ctx }}
  replicas: 1
  selector:
    matchLabels: {{- include "platform.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" $ctx | nindent 8 }}
    spec:
      {{- include "platform.pullSecrets" . | nindent 6 }}
      {{- include "platform.podSecurity" (dict "uid" 1000) | nindent 6 }}
      {{- include "platform.scheduling" .Values | nindent 6 }}
      containers:
        - name: garage
          image: {{ include "platform.image" (dict "ctx" $ "img" .Values.garage.image) }}
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: garage-rpc-secret}}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: garage-admin-token}}
          ports: [{name: s3, containerPort: 3900}, {name: rpc, containerPort: 3901}, {name: admin, containerPort: 3903}]
          readinessProbe: {tcpSocket: {port: s3}, periodSeconds: 5}
          resources: {{- toYaml .Values.garage.resources | nindent 12 }}
          {{- include "platform.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml}
            - {name: data, mountPath: /var/lib/garage}
        # Layout, bucket and the services' key (idempotent), then idle: a sidecar
        # instead of a hook, so the services find the bucket during helm --wait.
        - name: bootstrap
          image: {{ include "platform.image" (dict "ctx" $ "img" .Values.garage.bootstrapImage) }}
          command: [/bin/sh, -c, "sh /bootstrap/bootstrap.sh && exec sleep 2147483647"]
          env:
            - {name: GARAGE_HOST, value: 127.0.0.1}
            - {name: GARAGE_CAPACITY, value: {{ include "platform.bytes" .Values.garage.capacity | quote }}}
            - {name: S3_BUCKET, value: {{ .Values.garage.bucket | quote }}}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: garage-admin-token}}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: s3-access-key}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: s3-secret-key}}
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
          {{- include "platform.containerSecurity" . | nindent 10 }}
          volumeMounts: [{name: config, mountPath: /bootstrap}]
      volumes:
        - {name: config, configMap: {name: {{ include "platform.name" $ctx }}}}
        {{- include "platform.dataVolume" .Values.garage | nindent 8 }}
  {{- include "platform.claims" (dict "persistence" .Values.garage.persistence "global" (include "platform.storageClass" .)) | nindent 2 }}
{{- end }}
