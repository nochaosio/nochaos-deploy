{{- if .Values.postgresql.enabled }}
{{- $ctx := dict "ctx" $ "name" "postgres" }}
{{ include "platform.service" (merge (dict "port" 5432) $ctx) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "platform.name" $ctx }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ include "platform.name" $ctx }}
  replicas: 1
  selector:
    matchLabels: {{- include "platform.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" $ctx | nindent 8 }}
    spec:
      {{- include "platform.pullSecrets" . | nindent 6 }}
      {{- include "platform.podSecurity" (dict "uid" 70) | nindent 6 }}
      {{- include "platform.scheduling" .Values | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "platform.image" (dict "ctx" $ "img" .Values.postgresql.image) }}
          env:
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "platform.secretName" . }}, key: postgres-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, {{ .Values.postgresql.username | quote }}]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, {{ .Values.postgresql.username | quote }}]}
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          {{- include "platform.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - {name: run, emptyDir: {}}
        {{- include "platform.dataVolume" .Values.postgresql | nindent 8 }}
  {{- include "platform.claims" (dict "persistence" .Values.postgresql.persistence "global" (include "platform.storageClass" .)) | nindent 2 }}
{{- end }}
