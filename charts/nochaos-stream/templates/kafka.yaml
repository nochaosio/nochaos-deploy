{{- $ctx := dict "ctx" $ "name" "kafka" }}
{{- $svc := include "stream.name" $ctx }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  labels: {{- include "stream.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "stream.selector" $ctx | nindent 4 }}
  ports: [{name: kafka, port: 9092, targetPort: kafka}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $svc }}
  labels: {{- include "stream.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ $svc }}
  replicas: 1
  selector:
    matchLabels: {{- include "stream.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "stream.labels" $ctx | nindent 8 }}
    spec:
      {{- include "stream.podSecurity" (dict "uid" 1000) | nindent 6 }}
      {{- include "stream.scheduling" .Values | nindent 6 }}
      containers:
        - name: kafka
          image: {{ include "stream.image" (dict "ctx" $ "img" .Values.kafka.image) }}
          env:
            # One KRaft node, broker and controller.
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ $svc }}:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_RETENTION_HOURS, value: {{ .Values.kafka.retentionHours | quote }}}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx768m"}
          ports: [{name: kafka, containerPort: 9092}, {name: controller, containerPort: 9093}]
          readinessProbe: {tcpSocket: {port: kafka}, periodSeconds: 5}
          resources: {{- toYaml .Values.kafka.resources | nindent 12 }}
          {{- include "stream.containerSecurity" . | nindent 10 }}
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
      {{- with (include "stream.dataVolume" .Values.kafka) }}
      volumes: {{- . | nindent 8 }}
      {{- end }}
  {{- include "stream.claims" (dict "persistence" .Values.kafka.persistence "global" (include "stream.storesStorageClass" .)) | nindent 2 }}
---
# The topics the pipeline and the Flink jobs use (auto-creation is off).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $svc }}-topics
  labels: {{- include "stream.labels" (dict "ctx" $ "name" "kafka-topics") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {{- include "stream.labels" (dict "ctx" $ "name" "kafka-topics") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "stream.podSecurity" (dict "uid" 1000) | nindent 6 }}
      containers:
        - name: topics
          image: {{ include "stream.image" (dict "ctx" $ "img" .Values.kafka.image) }}
          command:
            - /bin/bash
            - -ec
            - |
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server {{ $svc }}:9092 >/dev/null 2>&1; do echo "waiting for kafka"; sleep 3; done
              for t in {{ join " " .Values.kafka.topics }}; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ $svc }}:9092 --create --if-not-exists --topic "$t" \
                  --partitions {{ .Values.kafka.partitions }} --replication-factor 1 --config max.message.bytes=8388608
              done
          env:
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx256m"}
          resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 512Mi}}
          {{- include "stream.containerSecurity" . | nindent 10 }}
