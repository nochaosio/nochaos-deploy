{{- if .Values.jaeger.enabled }}
{{- $ctx := dict "ctx" $ "name" "jaeger" }}
{{- $conf := include "stores.jaegerConf" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stores.name" $ctx }}
  labels: {{- include "stores.labels" $ctx | nindent 4 }}
data:
  default.conf: |
    {{- $conf | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stores.name" $ctx }}
  labels: {{- include "stores.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "stores.selector" $ctx | nindent 4 }}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stores.name" $ctx }}
  labels: {{- include "stores.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "stores.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "stores.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" $conf .Values.jaeger.uiVersion | sha256sum | trunc 16 }}
    spec:
      {{- include "stores.podSecurity" (dict "uid" 101) | nindent 6 }}
      {{- include "stores.scheduling" .Values | nindent 6 }}
      initContainers:
        # The Jaeger UI release, served under /jaeger/ (the API proxies that path).
        - name: assets
          image: {{ include "stores.image" (dict "ctx" $ "img" .Values.jaeger.assetsImage) }}
          command:
            - /bin/sh
            - -ec
            - |
              cd /tmp
              wget -qO- "https://github.com/jaegertracing/jaeger-ui/releases/download/{{ .Values.jaeger.uiVersion }}/assets.tar.gz" | tar xz
              rm -rf /srv/jaeger && mv packages/jaeger-ui/build /srv/jaeger
              sed -i 's#<base href="/" data-inject-target="BASE_URL" />#<base href="/jaeger/" data-inject-target="BASE_URL" />#' /srv/jaeger/index.html
              grep -q 'base href="/jaeger/"' /srv/jaeger/index.html
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
          {{- include "stores.containerSecurity" . | nindent 10 }}
          volumeMounts: [{name: assets, mountPath: /srv}, {name: tmp, mountPath: /tmp}]
      containers:
        - name: jaeger-ui
          image: {{ include "stores.image" (dict "ctx" $ "img" .Values.jaeger.image) }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /jaeger/healthz, port: http}, periodSeconds: 5}
          resources: {{- toYaml .Values.jaeger.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            - {name: assets, mountPath: /srv, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: {{ include "stores.name" $ctx }}}}
        - {name: assets, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
{{- end }}
